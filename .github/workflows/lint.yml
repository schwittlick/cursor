name: Lint

on: push

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements.txt)"

      - name: Run Ruff linter
        run: ruff check cursor

      - name: Run Ruff formatter check
        run: ruff format --check cursor
