[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor"
version = "250714"
description = "cursor line experiments"
authors = [
    { name = "Marcel Schwittlick", email = "info@schwittlick.net" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = "==3.14.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/schwittlick/cursor"
Repository = "https://github.com/schwittlick/cursor"

[project.scripts]
cursor_recorder = "cursor.recorder:main"
discovery = "cursor.tools.discovery:discover"
sendhpgl = "cursor.tools.sendhpgl:main"
braille_convert = "cursor.tools.braille_converter:main"


[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["cursor*"]

[tool.setuptools.package-data]
cursor = ["*", "data/*", "data/**/*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Replicate flake8 ignore rules: E402,W503,E203,E303,E722,E741,E731,W504
ignore = ["E402", "W505", "E203", "E303", "E722", "E741", "E731"]
select = ["E", "F", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
